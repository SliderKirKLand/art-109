<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Things Move</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="motion-page">
        <h1>Make Things Move</h1>
        <section class="demo" aria-label="CSS movement demo">
            <input class="move-toggle" id="moveToggle" type="checkbox">
            <div class="moving-square" id="movingSquare"></div>
            <label class="move-button" for="moveToggle">
                <span class="press-text">Press Me</span>
                <span class="back-text">Move Back</span>
            </label>
        </section>
        <div class="loading-track" aria-label="Loading animation">
            <div class="loading-bar" id="loadingBar">Loading...</div>
        </div>
    </main>
</body>

</html>
